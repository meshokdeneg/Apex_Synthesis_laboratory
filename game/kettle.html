<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ASL | Симулятор чайника</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: url('../photo/i.png') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Segoe UI', 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .game-container {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            border-radius: 48px;
            padding: 25px;
            border: 2px solid #FF8C00;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 550px;
            width: 100%;
            transition: 0.2s;
        }

        h1 {
            font-size: 32px;
            color: #FF8C00;
            margin-bottom: 8px;
            text-shadow: 2px 2px 0 #4A90E2;
        }

        .sub {
            color: #ccc;
            font-size: 14px;
            margin-bottom: 20px;
        }

        /* Котейник (чайник) */
        .kettle-area {
            background: #1e2a2f;
            border-radius: 60px;
            padding: 25px;
            margin-bottom: 20px;
            position: relative;
            border: 2px solid #4A90E2;
        }

        .kettle {
            position: relative;
            width: 220px;
            height: 220px;
            margin: 0 auto;
            background: #c0c0c0;
            background: linear-gradient(145deg, #d0d0d0, #a0a0a0);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3), inset 0 2px 5px rgba(255,255,255,0.6);
            transition: transform 0.1s;
        }

        /* Носик */
        .kettle::before {
            content: "";
            position: absolute;
            top: 50px;
            right: -30px;
            width: 50px;
            height: 35px;
            background: #b0b0b0;
            border-radius: 0 40% 40% 0;
            transform: rotate(15deg);
            box-shadow: inset 0 0 5px rgba(0,0,0,0.2);
        }

        /* Крышка */
        .kettle::after {
            content: "";
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 70px;
            height: 20px;
            background: #888;
            border-radius: 20px 20px 10px 10px;
            box-shadow: inset 0 1px 3px rgba(255,255,255,0.5), 0 3px 5px rgba(0,0,0,0.2);
        }

        /* Ручка */
        .handle {
            position: absolute;
            top: 30px;
            left: -35px;
            width: 50px;
            height: 70px;
            border: 6px solid #6a6a6a;
            border-radius: 30px;
            background: transparent;
            transform: rotate(-20deg);
        }

        /* Пар (анимация) */
        .steam {
            position: absolute;
            top: -30px;
            left: 50%;
            width: 20px;
            height: 40px;
            background: rgba(255,255,255,0.6);
            filter: blur(6px);
            border-radius: 50%;
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
        }

        .kettle.boiling .steam {
            opacity: 0.8;
            animation: steamFloat 0.5s infinite alternate;
        }

        @keyframes steamFloat {
            0% { transform: translateX(-50%) translateY(0) scale(1); opacity: 0.5; }
            100% { transform: translateX(-50%) translateY(-20px) scale(1.5); opacity: 0; }
        }

        /* Шкала нагрева */
        .temp-bar {
            width: 100%;
            background: #2c3e2f;
            border-radius: 30px;
            padding: 4px;
            margin: 15px 0;
        }

        .temp-fill {
            height: 20px;
            width: 0%;
            background: linear-gradient(90deg, #00ff00, #ffff00, #ff3300);
            border-radius: 30px;
            transition: width 0.1s linear;
        }

        .temp-value {
            font-size: 24px;
            font-weight: bold;
            color: #FF8C00;
            margin: 5px 0;
        }

        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin: 20px 0;
        }

        button {
            background: #4A90E2;
            border: none;
            border-radius: 60px;
            padding: 12px 28px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            transition: 0.1s;
            box-shadow: 0 5px 0 #1a3a5a;
        }
        button:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #1a3a5a;
        }
        .danger-btn {
            background: #c0392b;
            box-shadow: 0 5px 0 #8a1a1a;
        }

        .status {
            font-size: 18px;
            background: #1a2a2f;
            padding: 8px;
            border-radius: 40px;
            margin: 15px 0;
            color: #FF8C00;
        }

        /* Летающие кубы при взрыве */
        .cube-explode {
            position: fixed;
            width: 40px;
            height: 40px;
            background: #FF8C00;
            border: 2px solid #fff;
            transform: rotate(45deg);
            pointer-events: none;
            z-index: 1000;
            animation: flyCube 1.5s forwards;
        }

        @keyframes flyCube {
            0% { transform: rotate(45deg) scale(0.5); opacity: 1; }
            100% { transform: rotate(360deg) translateY(-300px) translateX(100px) scale(1.5); opacity: 0; }
        }

        .gluk-message {
            background: rgba(0,0,0,0.8);
            border-left: 6px solid #00FF9D;
            padding: 10px;
            border-radius: 20px;
            margin-top: 15px;
            color: #0f0;
            font-size: 14px;
            text-align: left;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #FF8C00;
            text-decoration: none;
            border: 1px solid #FF8C00;
            border-radius: 40px;
            padding: 6px 20px;
            transition: 0.2s;
        }
        .back-link:hover {
            background: #FF8C00;
            color: #000;
        }
    </style>
</head>
<body>
<div class="game-container">
    <h1>⚡ СИМУЛЯТОР ЧАЙНИКА ⚡</h1>
    <div class="sub">ASL — отдел бытовой термодинамики</div>

    <div class="kettle-area">
        <div class="kettle" id="kettle">
            <div class="handle"></div>
            <div class="steam" id="steam"></div>
        </div>
        <div class="temp-bar">
            <div class="temp-fill" id="tempFill"></div>
        </div>
        <div class="temp-value">🌡️ <span id="tempValue">0</span>°C</div>
    </div>

    <div class="controls">
        <button id="heatBtn">🔥 НАГРЕТЬ</button>
        <button id="resetBtn" class="danger-btn">🧊 ОСТУДИТЬ</button>
    </div>
    <div class="status" id="statusText">Чайник холодный. Пора греть!</div>
    <div class="gluk-message" id="glukMsg">🟩 ГЛюК: Не перегрей, а то будет весело...</div>
    <a href="../minigames.html" class="back-link">← ВЕРНУТЬСЯ К ИГРАМ</a>
</div>

<script>
    // Состояние
    let temperature = 0;          // 0..150
    let isExploded = false;
    let heatInterval = null;
    let coolingInterval = null;
    let explosionTimeout = null;
    
    const MAX_TEMP = 150;
    const OVERHEAT_TEMP = 130;    // зона риска
    const EXPLOSION_TEMP = 150;
    
    const heatStep = 12;          // градусов за клик
    const coolingRate = 0.5;      // остывание в секунду
    
    const kettleEl = document.getElementById('kettle');
    const tempFill = document.getElementById('tempFill');
    const tempSpan = document.getElementById('tempValue');
    const statusDiv = document.getElementById('statusText');
    const glukMsgDiv = document.getElementById('glukMsg');
    const heatBtn = document.getElementById('heatBtn');
    const resetBtn = document.getElementById('resetBtn');
    
    // Фразы ГЛюКа (обычные и предупреждения)
    const normalMessages = [
        "Греешь? Надеюсь, ты знаешь предел прочности этого чайника.",
        "ASL одобряет нагрев, но не одобрит взрыв лаборатории.",
        "Осторожно, пар! Ты хоть предохранитель проверил?",
        "Ещё чуть-чуть и начнётся синтез чая...",
        "Я бы посоветовал прекратить, но люблю смотреть за катастрофами.",
        "Ты знаешь, что при 150 градусах вода превращается в плазму? Нет? Сейчас узнаешь."
    ];
    
    const warningMessages = [
        "⚠️ Чайник свистит! Температура зашкаливает!",
        "⚠️ Крышка трясётся! Остановись, пока не поздно!",
        "⚠️ Из носика пошёл пар с искрами! Срочно остуди!",
        "⚠️ Корпус краснеет! Ты что, устроить хочешь?",
        "⚠️ ГЛюК: я не шучу, ещё 5 градусов и взрыв!"
    ];
    
    const explosionMessages = [
        "💥 БА-БАХ! Чайник разлетелся на молекулы! Ты гений разрушения.",
        "💥 Поздравляю! Лаборатория ASL временно потеряла один чайник. Надеюсь, ты доволен.",
        "💥 Теперь понятно, почему у нас в отделе пожарная сигналиция воет каждые 5 минут.",
        "💥 Рекорд! Ты перегрел чайник до плазмы. Кубов летает больше, чем молекул.",
        "💥 ... Ну, я же предупреждал. Админы сейчас придут ругаться."
    ];
    
    function updateUI() {
        let percent = (temperature / MAX_TEMP) * 100;
        tempFill.style.width = percent + '%';
        tempSpan.innerText = Math.floor(temperature);
        
        // Цветовая индикация
        if (temperature >= EXPLOSION_TEMP) {
            tempFill.style.background = "#ff0000";
        } else if (temperature >= OVERHEAT_TEMP) {
            tempFill.style.background = "#ff6600";
        } else {
            tempFill.style.background = "linear-gradient(90deg, #00ff00, #ffff00, #ff3300)";
        }
        
        // Эффект кипения / пара
        if (temperature > 80 && !isExploded) {
            kettleEl.classList.add('boiling');
            if (temperature > 120) {
                kettleEl.style.filter = "drop-shadow(0 0 8px #ff6600)";
            } else {
                kettleEl.style.filter = "";
            }
        } else {
            kettleEl.classList.remove('boiling');
            kettleEl.style.filter = "";
        }
        
        // Текст статуса
        if (isExploded) {
            statusDiv.innerHTML = "💀 ЧАЙНИК УНИЧТОЖЕН! Нажми «Остудить», чтобы начать заново 💀";
        } else if (temperature === 0) {
            statusDiv.innerHTML = "🧊 Чайник ледяной. Нажми «Нагреть» для начала эксперимента.";
        } else if (temperature < 50) {
            statusDiv.innerHTML = "🌡️ Вода тёплая, но чай ещё не заварится.";
        } else if (temperature < 90) {
            statusDiv.innerHTML = "☕ Идеальная температура для чая! Наслаждайся, пока не перегрел.";
        } else if (temperature < EXPLOSION_TEMP) {
            statusDiv.innerHTML = "💨 КИПИТ! Почти опасно, остуди, если не хочешь взрыва.";
        } else {
            statusDiv.innerHTML = "💥 КРИТИЧЕСКИЙ ПЕРЕГРЕВ! НЕМЕДЛЕННО ОСТУДИ!";
        }
        
        // Случайные фразы ГЛюКа (только не при взрыве)
        if (!isExploded && temperature > 0 && Math.random() < 0.08) {
            let msg = normalMessages[Math.floor(Math.random() * normalMessages.length)];
            glukMsgDiv.innerHTML = "🟩 ГЛюК: " + msg;
            setTimeout(() => {
                if (!isExploded && glukMsgDiv.innerHTML.includes("ГЛюК"))
                    glukMsgDiv.innerHTML = "🟩 ГЛюК: Не перегрей, а то будет весело...";
            }, 3000);
        }
        
        // Предупреждения при высокой температуре
        if (!isExploded && temperature >= OVERHEAT_TEMP && temperature < EXPLOSION_TEMP && Math.random() < 0.1) {
            let warn = warningMessages[Math.floor(Math.random() * warningMessages.length)];
            glukMsgDiv.innerHTML = "🟩 ГЛюК: " + warn;
        }
    }
    
    function startCooling() {
        if (coolingInterval) clearInterval(coolingInterval);
        if (isExploded) return;
        coolingInterval = setInterval(() => {
            if (!isExploded && temperature > 0) {
                temperature = Math.max(0, temperature - coolingRate);
                updateUI();
                if (temperature === 0) stopCooling();
            } else if (isExploded) {
                stopCooling();
            }
        }, 1000);
    }
    
    function stopCooling() {
        if (coolingInterval) {
            clearInterval(coolingInterval);
            coolingInterval = null;
        }
    }
    
    function stopHeating() {
        if (heatInterval) {
            clearInterval(heatInterval);
            heatInterval = null;
        }
    }
    
    function explode() {
        if (isExploded) return;
        isExploded = true;
        stopHeating();
        stopCooling();
        
        // Взрывная анимация: летящие кубы
        for (let i = 0; i < 40; i++) {
            setTimeout(() => {
                const cube = document.createElement('div');
                cube.className = 'cube-explode';
                cube.style.left = (Math.random() * window.innerWidth) + 'px';
                cube.style.top = (window.innerHeight / 2 + (Math.random() - 0.5) * 200) + 'px';
                cube.style.background = `hsl(${Math.random() * 360}, 70%, 55%)`;
                cube.style.transform = `rotate(${Math.random() * 360}deg)`;
                document.body.appendChild(cube);
                setTimeout(() => cube.remove(), 1500);
            }, i * 40);
        }
        
        // Красная вспышка фона
        const container = document.querySelector('.game-container');
        container.style.transition = '0.05s';
        container.style.background = '#8b0000';
        setTimeout(() => { container.style.background = ''; }, 200);
        
        // Сообщение ГЛюКа о взрыве
        let explMsg = explosionMessages[Math.floor(Math.random() * explosionMessages.length)];
        glukMsgDiv.innerHTML = "💥 ГЛюК: " + explMsg;
        statusDiv.innerHTML = "💀 ВЗРЫВ! Чайник уничтожен. Нажми «Остудить», чтобы восстановить. 💀";
        
        // Скрываем чайник? Не скрываем, но делаем тряску
        kettleEl.style.animation = 'shake 0.3s ease-in-out 3';
        setTimeout(() => {
            kettleEl.style.animation = '';
        }, 900);
        
        // Сброс температуры (на экране оставляем 150, но при ресете сбросится)
        temperature = EXPLOSION_TEMP;
        updateUI();
    }
    
    function heat() {
        if (isExploded) {
            glukMsgDiv.innerHTML = "🟩 ГЛюК: Чайника больше нет. Нажми «Остудить», чтобы начать заново.";
            return;
        }
        if (temperature >= EXPLOSION_TEMP) {
            explode();
            return;
        }
        let newTemp = temperature + heatStep;
        if (newTemp >= EXPLOSION_TEMP) {
            temperature = EXPLOSION_TEMP;
            updateUI();
            explode();
            return;
        }
        temperature = newTemp;
        if (temperature > MAX_TEMP) temperature = MAX_TEMP;
        updateUI();
        
        // Запускаем остывание после нагрева
        startCooling();
        
        // Вибрация телефона (если поддерживается)
        if (temperature > 100 && navigator.vibrate) navigator.vibrate(100);
    }
    
    function reset() {
        if (explosionTimeout) clearTimeout(explosionTimeout);
        isExploded = false;
        temperature = 0;
        stopHeating();
        stopCooling();
        updateUI();
        kettleEl.style.filter = "";
        kettleEl.style.animation = "";
        glukMsgDiv.innerHTML = "🟩 ГЛюК: Чайник как новый. Не взорви снова, ладно?";
        statusDiv.innerHTML = "Чайник остыл. Можно начинать заново.";
        startCooling(); // медленное остывание при нуле не нужно, но запустим для порядка
    }
    
    // Обработчики кнопок
    heatBtn.addEventListener('click', heat);
    resetBtn.addEventListener('click', reset);
    
    // Анимация встряски при взрыве
    const styleShake = document.createElement('style');
    styleShake.textContent = `
        @keyframes shake {
            0% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(5px, -5px) rotate(5deg); }
            50% { transform: translate(-5px, 2px) rotate(-3deg); }
            75% { transform: translate(3px, -2px) rotate(2deg); }
            100% { transform: translate(0, 0) rotate(0); }
        }
    `;
    document.head.appendChild(styleShake);
    
    // Инициализация
    updateUI();
    startCooling(); // чтобы чайник остывал сам по себе
</script>
</body>
</html>
