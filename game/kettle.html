<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ASL | Симулятор чайника 2D — Удерживай нагрев</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: url('../photo/i.png') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Segoe UI', 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .game-container {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            border-radius: 48px;
            padding: 25px;
            border: 2px solid #FF8C00;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 600px;
            width: 100%;
            transition: 0.2s;
        }

        h1 {
            font-size: 32px;
            color: #FF8C00;
            margin-bottom: 8px;
            text-shadow: 2px 2px 0 #4A90E2;
        }

        .sub {
            color: #ccc;
            font-size: 14px;
            margin-bottom: 20px;
        }

        /* Область чайника с плитой */
        .kettle-area {
            background: #1e2a2f;
            border-radius: 60px;
            padding: 25px 25px 35px 25px;
            margin-bottom: 20px;
            position: relative;
            border: 2px solid #4A90E2;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        /* Плита (конфорка) */
        .stove {
            position: relative;
            width: 200px;
            height: 40px;
            margin: 0 auto;
            background: #2c2c2c;
            border-radius: 40px;
            box-shadow: 0 8px 12px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.1);
            overflow: hidden;
            z-index: 2;
        }
        .stove::before {
            content: "";
            position: absolute;
            top: 5px;
            left: 50%;
            transform: translateX(-50%);
            width: 160px;
            height: 30px;
            background: radial-gradient(ellipse at center, #444, #222);
            border-radius: 30px;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.5);
        }
        .stove-hot {
            background: #4a1a1a;
            animation: stoveGlow 0.5s infinite alternate;
        }
        .stove-hot::before {
            background: radial-gradient(ellipse at center, #ff6600, #aa3300);
            box-shadow: 0 0 20px #ff3300;
        }
        @keyframes stoveGlow {
            from { box-shadow: 0 0 5px #ff3300; }
            to { box-shadow: 0 0 20px #ff6600; }
        }

        /* Чайник — нормальная вёрстка без абсолютного позиционирования каждой детали */
        .kettle {
            position: relative;
            width: 240px;
            height: 200px;
            margin: 0 auto 15px auto;
            z-index: 5;
        }

        /* Корпус чайника (основная часть) */
        .kettle-body {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 160px;
            background: radial-gradient(ellipse at 30% 35%, #e8e8e8, #b0b0b0);
            border-radius: 50% 50% 45% 45% / 60% 60% 40% 40%;
            box-shadow: 0 15px 25px rgba(0,0,0,0.3), inset 0 2px 5px rgba(255,255,255,0.8);
            transition: transform 0.1s;
        }

        /* Блик на корпусе */
        .kettle-body::before {
            content: "";
            position: absolute;
            top: 15%;
            left: 20%;
            width: 40%;
            height: 30%;
            background: radial-gradient(ellipse, rgba(255,255,255,0.6), rgba(255,255,255,0));
            border-radius: 50%;
            pointer-events: none;
        }

        /* Носик чайника */
        .spout {
            position: absolute;
            top: 30px;
            right: -25px;
            width: 55px;
            height: 40px;
            background: linear-gradient(145deg, #c0c0c0, #909090);
            border-radius: 0 50% 50% 0;
            transform: rotate(10deg);
            box-shadow: inset -2px -2px 5px rgba(0,0,0,0.2), inset 1px 1px 2px rgba(255,255,255,0.6);
            z-index: 6;
        }
        .spout::after {
            content: "";
            position: absolute;
            top: -5px;
            left: -10px;
            width: 20px;
            height: 15px;
            background: #a0a0a0;
            border-radius: 50%;
        }

        /* Крышка */
        .lid {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 85px;
            height: 22px;
            background: linear-gradient(145deg, #c8c8c8, #888);
            border-radius: 40px 40px 20px 20px;
            box-shadow: inset 0 1px 2px rgba(255,255,255,0.5), 0 5px 8px rgba(0,0,0,0.2);
            z-index: 7;
        }
        .lid::after {
            content: "●";
            position: absolute;
            top: -8px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 20px;
            color: #FF8C00;
            text-shadow: 0 0 3px #ff6600;
        }

        /* Ручка */
        .handle {
            position: absolute;
            top: 15px;
            left: -45px;
            width: 60px;
            height: 80px;
            border: 8px solid #6a6a6a;
            border-radius: 50px;
            background: transparent;
            transform: rotate(-20deg);
            box-shadow: inset 0 0 3px rgba(0,0,0,0.3), 2px 5px 8px rgba(0,0,0,0.2);
            z-index: 8;
        }

        /* Пар */
        .steam {
            position: absolute;
            top: -30px;
            left: 50%;
            width: 24px;
            height: 50px;
            background: rgba(255,255,255,0.7);
            filter: blur(10px);
            border-radius: 50%;
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
            z-index: 6;
        }

        .kettle.boiling .steam {
            opacity: 0.9;
            animation: steamFloat 0.4s infinite alternate;
        }

        @keyframes steamFloat {
            0% { transform: translateX(-50%) translateY(0) scale(1); opacity: 0.6; }
            100% { transform: translateX(-50%) translateY(-25px) scale(1.6); opacity: 0; }
        }

        /* Анимация взрыва и исчезновения чайника */
        .kettle.explode .kettle-body,
        .kettle.explode .spout,
        .kettle.explode .lid,
        .kettle.explode .handle {
            animation: kettleExplode 0.5s forwards;
        }
        @keyframes kettleExplode {
            0% { transform: scale(1) rotate(0deg); opacity: 1; filter: brightness(1); }
            30% { transform: scale(1.2) rotate(10deg); opacity: 0.8; filter: brightness(1.5); }
            100% { transform: scale(0) rotate(45deg); opacity: 0; filter: blur(10px); }
        }

        /* Осколки */
        .debris {
            position: absolute;
            width: 8px;
            height: 8px;
            background: #c0c0c0;
            border-radius: 2px;
            pointer-events: none;
            z-index: 10;
            animation: debrisFly 0.6s forwards;
        }
        @keyframes debrisFly {
            0% { transform: translate(0, 0) rotate(0deg); opacity: 1; }
            100% { transform: translate(var(--dx), var(--dy)) rotate(360deg); opacity: 0; }
        }

        /* Дым и искры */
        .smoke-puff {
            position: absolute;
            background: radial-gradient(circle, #555, #222);
            border-radius: 50%;
            pointer-events: none;
            z-index: 10;
            opacity: 0;
            animation: smokePuff 0.8s forwards;
        }
        @keyframes smokePuff {
            0% { opacity: 0.7; transform: scale(0.5); }
            100% { opacity: 0; transform: scale(3); }
        }
        .shockwave {
            position: absolute;
            border-radius: 50%;
            background: rgba(255,100,0,0.6);
            pointer-events: none;
            z-index: 15;
            animation: shockwaveAnim 0.4s forwards;
        }
        @keyframes shockwaveAnim {
            0% { transform: scale(0.5); opacity: 0.8; }
            100% { transform: scale(3); opacity: 0; }
        }

        /* Шкала температуры */
        .temp-bar {
            width: 100%;
            background: #2c3e2f;
            border-radius: 30px;
            padding: 4px;
            margin: 15px 0;
        }
        .temp-fill {
            height: 20px;
            width: 0%;
            background: linear-gradient(90deg, #00ff00, #ffff00, #ff3300);
            border-radius: 30px;
            transition: width 0.1s linear;
        }
        .temp-value {
            font-size: 24px;
            font-weight: bold;
            color: #FF8C00;
            margin: 5px 0;
        }

        /* Счёт и цель */
        .score-board {
            background: #1a2a2f;
            border-radius: 40px;
            padding: 10px;
            margin: 15px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
        }
        .score-item {
            background: #2c3e2f;
            padding: 8px 15px;
            border-radius: 30px;
            color: #FF8C00;
        }
        .goal-progress {
            background: #2c3e2f;
            border-radius: 20px;
            height: 12px;
            width: 100%;
            margin-top: 8px;
            overflow: hidden;
        }
        .goal-fill {
            width: 0%;
            height: 100%;
            background: #FF8C00;
            transition: width 0.2s;
        }

        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin: 20px 0;
        }
        button {
            background: #4A90E2;
            border: none;
            border-radius: 60px;
            padding: 12px 28px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            transition: 0.1s;
            box-shadow: 0 5px 0 #1a3a5a;
            touch-action: manipulation;
        }
        button:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #1a3a5a;
        }
        .danger-btn {
            background: #c0392b;
            box-shadow: 0 5px 0 #8a1a1a;
        }
        .heat-btn.heat-active {
            background: #ff8c00;
            color: #000;
            box-shadow: 0 5px 0 #b85c00;
            transform: scale(0.98);
        }

        .status {
            font-size: 18px;
            background: #1a2a2f;
            padding: 8px;
            border-radius: 40px;
            margin: 15px 0;
            color: #FF8C00;
        }
        .gluk-message {
            background: rgba(0,0,0,0.8);
            border-left: 6px solid #00FF9D;
            padding: 10px;
            border-radius: 20px;
            margin-top: 15px;
            color: #0f0;
            font-size: 14px;
            text-align: left;
        }
        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #FF8C00;
            text-decoration: none;
            border: 1px solid #FF8C00;
            border-radius: 40px;
            padding: 6px 20px;
            transition: 0.2s;
        }
        .back-link:hover {
            background: #FF8C00;
            color: #000;
        }
    </style>
</head>
<body>
<div class="game-container">
    <h1>🔥 ЧАЙНИК 2D: ПЛИТА И ПАР</h1>
    <div class="sub">отдел экспериментальной термодинамики</div>

    <div class="kettle-area">
        <div class="stove" id="stove"></div>
        <div class="kettle" id="kettle">
            <div class="kettle-body"></div>
            <div class="spout"></div>
            <div class="lid"></div>
            <div class="handle"></div>
            <div class="steam" id="steam"></div>
        </div>
        <div class="temp-bar">
            <div class="temp-fill" id="tempFill"></div>
        </div>
        <div class="temp-value">🌡️ <span id="tempValue">0</span>°C</div>
    </div>

    <div class="score-board">
        <div class="score-item">🏆 СЧЁТ: <span id="scoreValue">0</span></div>
        <div class="score-item">🎯 ЦЕЛЬ: 10 000</div>
    </div>
    <div class="goal-progress">
        <div class="goal-fill" id="goalFill"></div>
    </div>

    <div class="controls">
        <button id="heatBtn" class="heat-btn">🔥 НАГРЕВ</button>
        <button id="resetBtn" class="danger-btn">🧊 СБРОС</button>
    </div>
    <div class="status" id="statusText">Чайник холодный. Зажми кнопку — плита нагревается, чайник греется.</div>
    <div class="gluk-message" id="glukMsg">🟩 ГЛюК: Удерживай кнопку — температура растёт. Отпусти — остывает. Цель — 10 000 очков.</div>
    <a href="../minigames.html" class="back-link">← ВЕРНУТЬСЯ К ИГРАМ</a>
</div>

<script>
    // ==================== ЗВУКИ ====================
    let audioCtx = null;
    let boilingSource = null;
    let boilingGain = null;
    let isBoilingPlaying = false;

    function initAudio() {
        if (audioCtx) return;
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        boilingGain = audioCtx.createGain();
        boilingGain.gain.value = 0;
        boilingGain.connect(audioCtx.destination);
    }

    function startBoilingSound() {
        if (!audioCtx) return;
        if (isBoilingPlaying) return;
        const bufferSize = 4096;
        const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = noiseBuffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() - 0.5) * 0.4;
        boilingSource = audioCtx.createBufferSource();
        boilingSource.buffer = noiseBuffer;
        boilingSource.loop = true;
        boilingSource.connect(boilingGain);
        boilingSource.start();
        isBoilingPlaying = true;
        boilingGain.gain.linearRampToValueAtTime(0.25, audioCtx.currentTime + 0.5);
    }

    function stopBoilingSound() {
        if (!audioCtx || !isBoilingPlaying) return;
        boilingGain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.3);
        if (boilingSource) {
            boilingSource.stop(audioCtx.currentTime + 0.3);
            boilingSource = null;
        }
        isBoilingPlaying = false;
    }

    function playExplosionSound() {
        if (!audioCtx) return;
        const now = audioCtx.currentTime;
        const gain = audioCtx.createGain();
        gain.connect(audioCtx.destination);
        gain.gain.setValueAtTime(0.8, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.7);
        
        const osc = audioCtx.createOscillator();
        osc.type = 'sine';
        osc.frequency.value = 60;
        osc.connect(gain);
        osc.start(now);
        osc.stop(now + 0.6);
        
        const bufferSize = 4096;
        const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = noiseBuffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() - 0.5) * 0.9;
        const noiseSource = audioCtx.createBufferSource();
        noiseSource.buffer = noiseBuffer;
        noiseSource.connect(gain);
        noiseSource.start(now);
        noiseSource.stop(now + 0.5);
        
        for (let i = 0; i < 12; i++) {
            const tickGain = audioCtx.createGain();
            tickGain.connect(audioCtx.destination);
            tickGain.gain.setValueAtTime(0.3, now + i * 0.05);
            tickGain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.05 + 0.1);
            const tickOsc = audioCtx.createOscillator();
            tickOsc.type = 'triangle';
            tickOsc.frequency.value = 300 + Math.random() * 400;
            tickOsc.connect(tickGain);
            tickOsc.start(now + i * 0.05);
            tickOsc.stop(now + i * 0.05 + 0.1);
        }
    }

    // ==================== ОСНОВНАЯ ЛОГИКА ====================
    let temperature = 0;
    let score = 0;
    let isExploded = false;
    let isVictory = false;
    let heatingInterval = null;
    let coolingInterval = null;
    
    const MAX_TEMP = 150;
    const OVERHEAT_TEMP = 120;
    const EXPLOSION_TEMP = 150;
    const HEAT_RATE = 8;
    const COOLING_RATE = 1.2;
    const GOAL_SCORE = 10000;
    
    const kettleEl = document.getElementById('kettle');
    const stoveEl = document.getElementById('stove');
    const tempFill = document.getElementById('tempFill');
    const tempSpan = document.getElementById('tempValue');
    const statusDiv = document.getElementById('statusText');
    const glukMsgDiv = document.getElementById('glukMsg');
    const heatBtn = document.getElementById('heatBtn');
    const resetBtn = document.getElementById('resetBtn');
    const scoreSpan = document.getElementById('scoreValue');
    const goalFill = document.getElementById('goalFill');
    
    const normalMessages = [
        "Греешь? Помни, каждый градус — это очко. Но если перегреешь — всё пропало.",
        "ASL одобряет риск, но не одобрит взрыв лаборатории. Балансируй.",
        "Осторожно, пар! Скорость нагрева высокая, не отпускай слишком долго.",
        "Ещё чуть-чуть и начнётся синтез чая... и взрыв.",
        "Я бы посоветовал прекратить, но люблю смотреть за катастрофами.",
        "Ты знаешь, что при 150 градусах вода превращается в плазму? Нет? Сейчас узнаешь."
    ];
    const warningMessages = [
        "⚠️ Чайник свистит! Температура зашкаливает! Отпусти кнопку!",
        "⚠️ Крышка трясётся! Остановись, пока не поздно!",
        "⚠️ Из носика пошёл пар с искрами! Срочно остуди!",
        "⚠️ Корпус краснеет! Ты что, устроить хочешь?",
        "⚠️ ГЛюК: я не шучу, ещё 5 градусов и взрыв!"
    ];
    const explosionMessages = [
        "💥 БА-БАХ! Чайник разлетелся на молекулы! Ты потерял все очки.",
        "💥 Поздравляю! Лаборатория ASL временно потеряла один чайник. Надеюсь, ты доволен.",
        "💥 Теперь понятно, почему у нас в отделе пожарная сигнализация воет каждые 5 минут.",
        "💥 Рекорд! Ты перегрел чайник до плазмы. Очки обнулены.",
        "💥 ... Ну, я же предупреждал. Начинай заново."
    ];
    const victoryMessages = [
        "🏆 НЕВЕРОЯТНО! Ты набрал 10 000 очков, не взорвав чайник! ГЛюК в шоке.",
        "🏆 ПОБЕДА! Ты прошёл термическое испытание. Чайник выжил, очки засчитаны.",
        "🏆 Ты доказал, что способен контролировать тепло. ASL гордится тобой (почти).",
        "🏆 10 000 очков! Теперь ты официально мастер чайников. Но не расслабляйся — следующий взрыв будет больнее."
    ];
    
    function updateUI() {
        let percent = (temperature / MAX_TEMP) * 100;
        tempFill.style.width = percent + '%';
        tempSpan.innerText = Math.floor(temperature);
        if (temperature >= EXPLOSION_TEMP) tempFill.style.background = "#ff0000";
        else if (temperature >= OVERHEAT_TEMP) tempFill.style.background = "#ff6600";
        else tempFill.style.background = "linear-gradient(90deg, #00ff00, #ffff00, #ff3300)";
        
        if (!isExploded && !isVictory && temperature > 80 && !isBoilingPlaying && audioCtx) {
            startBoilingSound();
        } else if ((isExploded || isVictory || temperature <= 80) && isBoilingPlaying) {
            stopBoilingSound();
        }
        if (isBoilingPlaying && audioCtx && boilingGain) {
            let targetGain = Math.min(0.5, (temperature - 80) / 70) * 0.5;
            boilingGain.gain.linearRampToValueAtTime(targetGain, audioCtx.currentTime + 0.2);
        }
        
        if (!isExploded && !isVictory) {
            if (temperature > 80) {
                kettleEl.classList.add('boiling');
                if (temperature > 100) stoveEl.classList.add('stove-hot');
                else stoveEl.classList.remove('stove-hot');
                if (temperature > 120) kettleEl.style.filter = "drop-shadow(0 0 8px #ff6600)";
                else kettleEl.style.filter = "";
            } else {
                kettleEl.classList.remove('boiling');
                stoveEl.classList.remove('stove-hot');
                kettleEl.style.filter = "";
            }
        } else {
            kettleEl.classList.remove('boiling');
            stoveEl.classList.remove('stove-hot');
            kettleEl.style.filter = "";
        }
        
        if (isVictory) {
            statusDiv.innerHTML = "🏆 ПОБЕДА! Вы достигли цели! Нажмите «Сброс» для новой игры. 🏆";
        } else if (isExploded) {
            statusDiv.innerHTML = "💀 ЧАЙНИК УНИЧТОЖЕН! Нажми «Сброс», чтобы восстановить 💀";
        } else if (temperature === 0) {
            statusDiv.innerHTML = "🧊 Чайник ледяной. Зажми кнопку, чтобы нагреть и заработать очки!";
        } else if (temperature < 50) statusDiv.innerHTML = "🌡️ Вода тёплая, но очков ещё мало. Продолжай нагрев.";
        else if (temperature < 90) statusDiv.innerHTML = "☕ Идеальная температура для чая! Очки растут, но будь осторожен.";
        else if (temperature < EXPLOSION_TEMP) statusDiv.innerHTML = "💨 КИПИТ! Опасно близко к взрыву, отпусти кнопку!";
        else statusDiv.innerHTML = "💥 КРИТИЧЕСКИЙ ПЕРЕГРЕВ! НЕМЕДЛЕННО ОСТУДИ!";
        
        scoreSpan.innerText = score;
        let goalPercent = (score / GOAL_SCORE) * 100;
        if (goalPercent > 100) goalPercent = 100;
        goalFill.style.width = goalPercent + '%';
        
        if (!isExploded && !isVictory && score >= GOAL_SCORE) victory();
        
        if (!isExploded && !isVictory && temperature > 0 && Math.random() < 0.05) {
            let msg = normalMessages[Math.floor(Math.random() * normalMessages.length)];
            glukMsgDiv.innerHTML = "🟩 ГЛюК: " + msg;
            setTimeout(() => {
                if (!isExploded && !isVictory && glukMsgDiv.innerHTML.includes("ГЛюК"))
                    glukMsgDiv.innerHTML = "🟩 ГЛюК: Удерживай кнопку — нагрев. Отпусти — остывание.";
            }, 3500);
        }
        if (!isExploded && !isVictory && temperature >= OVERHEAT_TEMP && temperature < EXPLOSION_TEMP && Math.random() < 0.1) {
            let warn = warningMessages[Math.floor(Math.random() * warningMessages.length)];
            glukMsgDiv.innerHTML = "🟩 ГЛюК: " + warn;
        }
    }
    
    function victory() {
        if (isVictory || isExploded) return;
        isVictory = true;
        stopHeating();
        stopCooling();
        let winMsg = victoryMessages[Math.floor(Math.random() * victoryMessages.length)];
        glukMsgDiv.innerHTML = "🏆 ГЛюК: " + winMsg;
        statusDiv.innerHTML = "🎉 ПОБЕДА! Вы набрали 10 000 очков! Нажмите «Сброс», чтобы начать заново. 🎉";
        for (let i = 0; i < 50; i++) {
            setTimeout(() => {
                const star = document.createElement('div');
                star.textContent = "✨";
                star.style.position = "fixed";
                star.style.left = (Math.random() * window.innerWidth) + 'px';
                star.style.top = (window.innerHeight / 2 + (Math.random() - 0.5) * 200) + 'px';
                star.style.fontSize = "24px";
                star.style.pointerEvents = "none";
                star.style.zIndex = "1000";
                document.body.appendChild(star);
                setTimeout(() => star.remove(), 1000);
            }, i * 30);
        }
    }
    
    function explode() {
        if (isExploded) return;
        isExploded = true;
        stopHeating();
        stopCooling();
        if (isBoilingPlaying) stopBoilingSound();
        playExplosionSound();
        
        kettleEl.classList.add('explode');
        const rect = kettleEl.getBoundingClientRect();
        const containerRect = document.querySelector('.kettle-area').getBoundingClientRect();
        
        for (let i = 0; i < 60; i++) {
            const debris = document.createElement('div');
            debris.className = 'debris';
            const angle = Math.random() * 2 * Math.PI;
            const speed = 60 + Math.random() * 100;
            const dx = Math.cos(angle) * speed;
            const dy = Math.sin(angle) * speed - 30;
            debris.style.setProperty('--dx', dx + 'px');
            debris.style.setProperty('--dy', dy + 'px');
            debris.style.left = (rect.left - containerRect.left + Math.random() * rect.width) + 'px';
            debris.style.top = (rect.top - containerRect.top + Math.random() * rect.height) + 'px';
            document.querySelector('.kettle-area').appendChild(debris);
            setTimeout(() => debris.remove(), 700);
        }
        for (let i = 0; i < 25; i++) {
            const smoke = document.createElement('div');
            smoke.className = 'smoke-puff';
            smoke.style.left = (rect.left - containerRect.left + Math.random() * rect.width) + 'px';
            smoke.style.top = (rect.top - containerRect.top + Math.random() * rect.height) + 'px';
            smoke.style.width = '30px';
            smoke.style.height = '30px';
            document.querySelector('.kettle-area').appendChild(smoke);
            setTimeout(() => smoke.remove(), 800);
        }
        const wave = document.createElement('div');
        wave.className = 'shockwave';
        wave.style.left = (rect.left - containerRect.left + rect.width/2) + 'px';
        wave.style.top = (rect.top - containerRect.top + rect.height/2) + 'px';
        wave.style.width = '20px';
        wave.style.height = '20px';
        document.querySelector('.kettle-area').appendChild(wave);
        setTimeout(() => wave.remove(), 400);
        
        const container = document.querySelector('.game-container');
        container.style.transition = '0.05s';
        container.style.background = '#8b0000';
        setTimeout(() => container.style.background = '', 200);
        document.body.style.animation = 'camShake 0.2s ease-in-out 2';
        setTimeout(() => document.body.style.animation = '', 400);
        
        let explMsg = explosionMessages[Math.floor(Math.random() * explosionMessages.length)];
        glukMsgDiv.innerHTML = "💥 ГЛюК: " + explMsg;
        statusDiv.innerHTML = "💀 ВЗРЫВ! Чайник уничтожен. Нажми «Сброс», чтобы восстановить. 💀";
        score = 0;
        temperature = EXPLOSION_TEMP;
        updateUI();
        setTimeout(() => {
            kettleEl.style.visibility = 'hidden';
        }, 500);
    }
    
    function startCooling() {
        if (coolingInterval) clearInterval(coolingInterval);
        if (isExploded || isVictory) return;
        coolingInterval = setInterval(() => {
            if (!isExploded && !isVictory && temperature > 0) {
                temperature = Math.max(0, temperature - COOLING_RATE);
                updateUI();
            } else if (isExploded || isVictory) stopCooling();
        }, 1000);
    }
    function stopCooling() { if (coolingInterval) { clearInterval(coolingInterval); coolingInterval = null; } }
    
    function startHeating() {
        if (heatingInterval) return;
        if (isExploded || isVictory) return;
        heatingInterval = setInterval(() => {
            if (isExploded || isVictory) { stopHeating(); return; }
            if (temperature >= EXPLOSION_TEMP) { explode(); stopHeating(); return; }
            let newTemp = temperature + HEAT_RATE;
            if (newTemp >= EXPLOSION_TEMP) { temperature = EXPLOSION_TEMP; updateUI(); explode(); stopHeating(); return; }
            temperature = newTemp;
            if (!isExploded && !isVictory) { score += HEAT_RATE; if (score > GOAL_SCORE) score = GOAL_SCORE; }
            updateUI();
            if (temperature > 100 && navigator.vibrate) navigator.vibrate(50);
        }, 1000 / HEAT_RATE);
    }
    function stopHeating() { if (heatingInterval) { clearInterval(heatingInterval); heatingInterval = null; } }
    
    function resetGame() {
        isExploded = false; isVictory = false; temperature = 0; score = 0;
        stopHeating(); stopCooling();
        kettleEl.style.visibility = 'visible';
        kettleEl.classList.remove('explode');
        kettleEl.style.animation = '';
        kettleEl.style.filter = "";
        stoveEl.classList.remove('stove-hot');
        updateUI();
        glukMsgDiv.innerHTML = "🟩 ГЛюК: Чайник как новый. Цель — 10 000 очков. Удерживай кнопку для нагрева.";
        statusDiv.innerHTML = "Чайник остыл. Можно начинать заново.";
        startCooling();
    }
    
    function onHeatStart(e) {
        e.preventDefault();
        if (!audioCtx) initAudio();
        if (isExploded || isVictory) return;
        startHeating();
        heatBtn.classList.add('heat-active');
        heatBtn.textContent = "🔥 НАГРЕВАЮ...";
    }
    function onHeatEnd(e) {
        e.preventDefault();
        stopHeating();
        heatBtn.classList.remove('heat-active');
        heatBtn.textContent = "🔥 УДЕРЖИВАЙ НАГРЕВ";
    }
    
    heatBtn.addEventListener('mousedown', onHeatStart);
    heatBtn.addEventListener('mouseup', onHeatEnd);
    heatBtn.addEventListener('mouseleave', onHeatEnd);
    heatBtn.addEventListener('touchstart', onHeatStart, {passive: false});
    heatBtn.addEventListener('touchend', onHeatEnd);
    heatBtn.addEventListener('touchcancel', onHeatEnd);
    resetBtn.addEventListener('click', resetGame);
    
    updateUI();
    startCooling();
    
    const style = document.createElement('style');
    style.textContent = `
        @keyframes camShake {
            0% { transform: translate(1px, 1px); }
            25% { transform: translate(-2px, -1px); }
            50% { transform: translate(2px, 0px); }
            75% { transform: translate(-1px, 2px); }
            100% { transform: translate(0, 0); }
        }
    `;
    document.head.appendChild(style);
</script>
</body>
</html>
