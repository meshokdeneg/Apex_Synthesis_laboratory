<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ASL | Симулятор чайника 2D — Цель: 10 000 очков</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: url('../photo/i.png') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Segoe UI', 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .game-container {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            border-radius: 48px;
            padding: 25px;
            border: 2px solid #FF8C00;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 600px;
            width: 100%;
            transition: 0.2s;
        }

        h1 {
            font-size: 32px;
            color: #FF8C00;
            margin-bottom: 8px;
            text-shadow: 2px 2px 0 #4A90E2;
        }

        .sub {
            color: #ccc;
            font-size: 14px;
            margin-bottom: 20px;
        }

        /* Чайник */
        .kettle-area {
            background: #1e2a2f;
            border-radius: 60px;
            padding: 25px;
            margin-bottom: 20px;
            position: relative;
            border: 2px solid #4A90E2;
        }

        .kettle {
            position: relative;
            width: 220px;
            height: 220px;
            margin: 0 auto;
            background: linear-gradient(145deg, #d0d0d0, #a0a0a0);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3), inset 0 2px 5px rgba(255,255,255,0.6);
            transition: transform 0.1s;
        }

        .kettle::before {
            content: "";
            position: absolute;
            top: 50px;
            right: -30px;
            width: 50px;
            height: 35px;
            background: #b0b0b0;
            border-radius: 0 40% 40% 0;
            transform: rotate(15deg);
            box-shadow: inset 0 0 5px rgba(0,0,0,0.2);
        }

        .kettle::after {
            content: "";
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 70px;
            height: 20px;
            background: #888;
            border-radius: 20px 20px 10px 10px;
            box-shadow: inset 0 1px 3px rgba(255,255,255,0.5), 0 3px 5px rgba(0,0,0,0.2);
        }

        .handle {
            position: absolute;
            top: 30px;
            left: -35px;
            width: 50px;
            height: 70px;
            border: 6px solid #6a6a6a;
            border-radius: 30px;
            background: transparent;
            transform: rotate(-20deg);
        }

        .steam {
            position: absolute;
            top: -30px;
            left: 50%;
            width: 20px;
            height: 40px;
            background: rgba(255,255,255,0.6);
            filter: blur(6px);
            border-radius: 50%;
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
        }

        .kettle.boiling .steam {
            opacity: 0.8;
            animation: steamFloat 0.5s infinite alternate;
        }

        @keyframes steamFloat {
            0% { transform: translateX(-50%) translateY(0) scale(1); opacity: 0.5; }
            100% { transform: translateX(-50%) translateY(-20px) scale(1.5); opacity: 0; }
        }

        /* Шкала температуры */
        .temp-bar {
            width: 100%;
            background: #2c3e2f;
            border-radius: 30px;
            padding: 4px;
            margin: 15px 0;
        }

        .temp-fill {
            height: 20px;
            width: 0%;
            background: linear-gradient(90deg, #00ff00, #ffff00, #ff3300);
            border-radius: 30px;
            transition: width 0.1s linear;
        }

        .temp-value {
            font-size: 24px;
            font-weight: bold;
            color: #FF8C00;
            margin: 5px 0;
        }

        /* Счёт и цель */
        .score-board {
            background: #1a2a2f;
            border-radius: 40px;
            padding: 10px;
            margin: 15px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
        }
        .score-item {
            background: #2c3e2f;
            padding: 8px 15px;
            border-radius: 30px;
            color: #FF8C00;
        }
        .goal-progress {
            background: #2c3e2f;
            border-radius: 20px;
            height: 12px;
            width: 100%;
            margin-top: 8px;
            overflow: hidden;
        }
        .goal-fill {
            width: 0%;
            height: 100%;
            background: #FF8C00;
            transition: width 0.2s;
        }

        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin: 20px 0;
        }

        button {
            background: #4A90E2;
            border: none;
            border-radius: 60px;
            padding: 12px 28px;
            font-size: 18px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            transition: 0.1s;
            box-shadow: 0 5px 0 #1a3a5a;
        }
        button:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #1a3a5a;
        }
        .danger-btn {
            background: #c0392b;
            box-shadow: 0 5px 0 #8a1a1a;
        }

        .status {
            font-size: 18px;
            background: #1a2a2f;
            padding: 8px;
            border-radius: 40px;
            margin: 15px 0;
            color: #FF8C00;
        }

        .gluk-message {
            background: rgba(0,0,0,0.8);
            border-left: 6px solid #00FF9D;
            padding: 10px;
            border-radius: 20px;
            margin-top: 15px;
            color: #0f0;
            font-size: 14px;
            text-align: left;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #FF8C00;
            text-decoration: none;
            border: 1px solid #FF8C00;
            border-radius: 40px;
            padding: 6px 20px;
            transition: 0.2s;
        }
        .back-link:hover {
            background: #FF8C00;
            color: #000;
        }

        @keyframes shake {
            0% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(5px, -5px) rotate(5deg); }
            50% { transform: translate(-5px, 2px) rotate(-3deg); }
            75% { transform: translate(3px, -2px) rotate(2deg); }
            100% { transform: translate(0, 0) rotate(0); }
        }
    </style>
</head>
<body>
<div class="game-container">
    <h1>🔥 ЧАЙНИК 2D: ТЕРМИЧЕСКИЙ КОШМАР</h1>
    <div class="sub">ASL — отдел экспериментальной термодинамики</div>

    <div class="kettle-area">
        <div class="kettle" id="kettle">
            <div class="handle"></div>
            <div class="steam" id="steam"></div>
        </div>
        <div class="temp-bar">
            <div class="temp-fill" id="tempFill"></div>
        </div>
        <div class="temp-value">🌡️ <span id="tempValue">0</span>°C</div>
    </div>

    <div class="score-board">
        <div class="score-item">🏆 СЧЁТ: <span id="scoreValue">0</span></div>
        <div class="score-item">🎯 ЦЕЛЬ: 10 000</div>
    </div>
    <div class="goal-progress">
        <div class="goal-fill" id="goalFill"></div>
    </div>

    <div class="controls">
        <button id="heatBtn">🔥 НАГРЕТЬ (+15°C)</button>
        <button id="resetBtn" class="danger-btn">🧊 ОСТУДИТЬ (сброс)</button>
    </div>
    <div class="status" id="statusText">Чайник холодный. Начинай нагрев, но не перегрей!</div>
    <div class="gluk-message" id="glukMsg">🟩 ГЛюК: Цель — 10 000 очков. Каждое очко = 1°C нагрева. Действуй аккуратно...</div>
    <a href="../minigames.html" class="back-link">← ВЕРНУТЬСЯ К ИГРАМ</a>
</div>

<script>
    // --- Параметры сложности ---
    let temperature = 0;              // 0..150
    let score = 0;                   // очки (каждый градус нагрева даёт +1, остывание не отнимает)
    let isExploded = false;
    let heatInterval = null;
    let coolingInterval = null;
    
    const MAX_TEMP = 150;
    const OVERHEAT_TEMP = 120;       // зона риска (раньше 130)
    const EXPLOSION_TEMP = 150;
    const HEAT_STEP = 15;            // градусов за клик (быстрее)
    const COOLING_RATE = 0.9;        // остывание в секунду (быстрее)
    const GOAL_SCORE = 10000;
    
    const kettleEl = document.getElementById('kettle');
    const tempFill = document.getElementById('tempFill');
    const tempSpan = document.getElementById('tempValue');
    const statusDiv = document.getElementById('statusText');
    const glukMsgDiv = document.getElementById('glukMsg');
    const heatBtn = document.getElementById('heatBtn');
    const resetBtn = document.getElementById('resetBtn');
    const scoreSpan = document.getElementById('scoreValue');
    const goalFill = document.getElementById('goalFill');
    
    // Фразы ГЛюКа (обычные, предупреждения, победа)
    const normalMessages = [
        "Греешь? Помни, каждый градус — это очко. Но если перегреешь — всё пропало.",
        "ASL одобряет риск, но не одобрит взрыв лаборатории. Балансируй.",
        "Осторожно, пар! Скорость нагрева выше, чем твоя реакция?",
        "Ещё чуть-чуть и начнётся синтез чая... и взрыв.",
        "Я бы посоветовал прекратить, но люблю смотреть за катастрофами.",
        "Ты знаешь, что при 150 градусах вода превращается в плазму? Нет? Сейчас узнаешь."
    ];
    
    const warningMessages = [
        "⚠️ Чайник свистит! Температура зашкаливает! Остужай немедленно!",
        "⚠️ Крышка трясётся! Остановись, пока не поздно!",
        "⚠️ Из носика пошёл пар с искрами! Срочно остуди!",
        "⚠️ Корпус краснеет! Ты что, устроить хочешь?",
        "⚠️ ГЛюК: я не шучу, ещё 5 градусов и взрыв!"
    ];
    
    const explosionMessages = [
        "💥 БА-БАХ! Чайник разлетелся на молекулы! Ты потерял все очки.",
        "💥 Поздравляю! Лаборатория ASL временно потеряла один чайник. Надеюсь, ты доволен.",
        "💥 Теперь понятно, почему у нас в отделе пожарная сигнализация воет каждые 5 минут.",
        "💥 Рекорд! Ты перегрел чайник до плазмы. Очки обнулены.",
        "💥 ... Ну, я же предупреждал. Начинай заново."
    ];
    
    const victoryMessages = [
        "🏆 НЕВЕРОЯТНО! Ты набрал 10 000 очков, не взорвав чайник! ГЛюК в шоке.",
        "🏆 ПОБЕДА! Ты прошёл термическое испытание. Чайник выжил, очки засчитаны.",
        "🏆 Ты доказал, что способен контролировать тепло. ASL гордится тобой (почти).",
        "🏆 10 000 очков! Теперь ты официально мастер чайников. Но не расслабляйся — следующий взрыв будет больнее."
    ];
    
    function updateUI() {
        let percent = (temperature / MAX_TEMP) * 100;
        tempFill.style.width = percent + '%';
        tempSpan.innerText = Math.floor(temperature);
        
        // Цветовая индикация
        if (temperature >= EXPLOSION_TEMP) {
            tempFill.style.background = "#ff0000";
        } else if (temperature >= OVERHEAT_TEMP) {
            tempFill.style.background = "#ff6600";
        } else {
            tempFill.style.background = "linear-gradient(90deg, #00ff00, #ffff00, #ff3300)";
        }
        
        // Эффект кипения / пара
        if (temperature > 80 && !isExploded) {
            kettleEl.classList.add('boiling');
            if (temperature > 120) {
                kettleEl.style.filter = "drop-shadow(0 0 8px #ff6600)";
            } else {
                kettleEl.style.filter = "";
            }
        } else {
            kettleEl.classList.remove('boiling');
            kettleEl.style.filter = "";
        }
        
        // Текст статуса
        if (isExploded) {
            statusDiv.innerHTML = "💀 ЧАЙНИК УНИЧТОЖЕН! Нажми «Остудить», чтобы начать заново 💀";
        } else if (temperature === 0) {
            statusDiv.innerHTML = "🧊 Чайник ледяной. Нагревай, чтобы заработать очки!";
        } else if (temperature < 50) {
            statusDiv.innerHTML = "🌡️ Вода тёплая, но очков ещё мало. Продолжай нагрев.";
        } else if (temperature < 90) {
            statusDiv.innerHTML = "☕ Идеальная температура для чая! Очки растут, но будь осторожен.";
        } else if (temperature < EXPLOSION_TEMP) {
            statusDiv.innerHTML = "💨 КИПИТ! Опасно близко к взрыву, сбавь темп!";
        } else {
            statusDiv.innerHTML = "💥 КРИТИЧЕСКИЙ ПЕРЕГРЕВ! НЕМЕДЛЕННО ОСТУДИ!";
        }
        
        // Обновление счёта и прогресса цели
        scoreSpan.innerText = score;
        let goalPercent = (score / GOAL_SCORE) * 100;
        if (goalPercent > 100) goalPercent = 100;
        goalFill.style.width = goalPercent + '%';
        
        // Проверка победы
        if (score >= GOAL_SCORE && !isExploded) {
            victory();
        }
        
        // Случайные фразы ГЛюКа (только не при взрыве и не при победе)
        if (!isExploded && score < GOAL_SCORE && temperature > 0 && Math.random() < 0.06) {
            let msg = normalMessages[Math.floor(Math.random() * normalMessages.length)];
            glukMsgDiv.innerHTML = "🟩 ГЛюК: " + msg;
            setTimeout(() => {
                if (!isExploded && glukMsgDiv.innerHTML.includes("ГЛюК") && score < GOAL_SCORE)
                    glukMsgDiv.innerHTML = "🟩 ГЛюК: Цель — 10 000 очков. Не взорви чайник!";
            }, 3500);
        }
        
        // Предупреждения при высокой температуре
        if (!isExploded && temperature >= OVERHEAT_TEMP && temperature < EXPLOSION_TEMP && Math.random() < 0.12) {
            let warn = warningMessages[Math.floor(Math.random() * warningMessages.length)];
            glukMsgDiv.innerHTML = "🟩 ГЛюК: " + warn;
        }
    }
    
    function victory() {
        if (isExploded) return;
        isExploded = true;
        stopHeating();
        stopCooling();
        let winMsg = victoryMessages[Math.floor(Math.random() * victoryMessages.length)];
        glukMsgDiv.innerHTML = "🏆 ГЛюК: " + winMsg;
        statusDiv.innerHTML = "🎉 ПОБЕДА! Вы набрали 10 000 очков! Нажмите «Остудить», чтобы начать заново. 🎉";
        // Эффект фейерверка (кубы)
        for (let i = 0; i < 60; i++) {
            setTimeout(() => {
                const cube = document.createElement('div');
                cube.className = 'cube-explode';
                cube.style.left = (Math.random() * window.innerWidth) + 'px';
                cube.style.top = (window.innerHeight / 2 + (Math.random() - 0.5) * 200) + 'px';
                cube.style.background = `hsl(${Math.random() * 360}, 70%, 55%)`;
                cube.style.transform = `rotate(${Math.random() * 360}deg)`;
                document.body.appendChild(cube);
                setTimeout(() => cube.remove(), 1500);
            }, i * 30);
        }
        // Блокируем нагрев
    }
    
    function startCooling() {
        if (coolingInterval) clearInterval(coolingInterval);
        if (isExploded) return;
        coolingInterval = setInterval(() => {
            if (!isExploded && temperature > 0) {
                temperature = Math.max(0, temperature - COOLING_RATE);
                updateUI();
                if (temperature === 0) stopCooling();
            } else if (isExploded) {
                stopCooling();
            }
        }, 1000);
    }
    
    function stopCooling() {
        if (coolingInterval) {
            clearInterval(coolingInterval);
            coolingInterval = null;
        }
    }
    
    function stopHeating() {
        if (heatInterval) {
            clearInterval(heatInterval);
            heatInterval = null;
        }
    }
    
    function explode() {
        if (isExploded) return;
        isExploded = true;
        stopHeating();
        stopCooling();
        
        // Взрывная анимация: летящие кубы
        for (let i = 0; i < 50; i++) {
            setTimeout(() => {
                const cube = document.createElement('div');
                cube.className = 'cube-explode';
                cube.style.left = (Math.random() * window.innerWidth) + 'px';
                cube.style.top = (window.innerHeight / 2 + (Math.random() - 0.5) * 200) + 'px';
                cube.style.background = `hsl(${Math.random() * 360}, 70%, 55%)`;
                cube.style.transform = `rotate(${Math.random() * 360}deg)`;
                document.body.appendChild(cube);
                setTimeout(() => cube.remove(), 1500);
            }, i * 40);
        }
        
        // Красная вспышка
        const container = document.querySelector('.game-container');
        container.style.transition = '0.05s';
        container.style.background = '#8b0000';
        setTimeout(() => { container.style.background = ''; }, 200);
        
        // Сообщение ГЛюКа о взрыве
        let explMsg = explosionMessages[Math.floor(Math.random() * explosionMessages.length)];
        glukMsgDiv.innerHTML = "💥 ГЛюК: " + explMsg;
        statusDiv.innerHTML = "💀 ВЗРЫВ! Все очки сброшены. Нажми «Остудить», чтобы восстановить. 💀";
        
        // Сброс счёта и температуры
        score = 0;
        temperature = EXPLOSION_TEMP;
        updateUI();
        
        // Тряска чайника
        kettleEl.style.animation = 'shake 0.3s ease-in-out 3';
        setTimeout(() => {
            kettleEl.style.animation = '';
        }, 900);
    }
    
    function heat() {
        if (isExploded) {
            glukMsgDiv.innerHTML = "🟩 ГЛюК: Чайник уничтожен. Нажми «Остудить», чтобы начать заново.";
            return;
        }
        if (score >= GOAL_SCORE) {
            glukMsgDiv.innerHTML = "🏆 ГЛюК: Ты уже победил! Нажми «Остудить» для новой игры.";
            return;
        }
        if (temperature >= EXPLOSION_TEMP) {
            explode();
            return;
        }
        let newTemp = temperature + HEAT_STEP;
        if (newTemp >= EXPLOSION_TEMP) {
            temperature = EXPLOSION_TEMP;
            updateUI();
            explode();
            return;
        }
        temperature = newTemp;
        // Начисляем очки: +HEAT_STEP за каждый клик (даже если перегреем, но до взрыва не доходим)
        if (temperature <= EXPLOSION_TEMP) {
            score += HEAT_STEP;
            if (score > GOAL_SCORE) score = GOAL_SCORE;
        }
        if (temperature > MAX_TEMP) temperature = MAX_TEMP;
        updateUI();
        
        // Запускаем остывание
        startCooling();
        
        // Вибрация при высокой температуре
        if (temperature > 100 && navigator.vibrate) navigator.vibrate(100);
    }
    
    function reset() {
        // Полный сброс игры
        isExploded = false;
        temperature = 0;
        score = 0;
        stopHeating();
        stopCooling();
        updateUI();
        kettleEl.style.filter = "";
        kettleEl.style.animation = "";
        glukMsgDiv.innerHTML = "🟩 ГЛюК: Чайник как новый. Цель — 10 000 очков. Не взорвись!";
        statusDiv.innerHTML = "Чайник остыл. Можно начинать заново.";
        startCooling();
    }
    
    // Обработчики кнопок
    heatBtn.addEventListener('click', heat);
    resetBtn.addEventListener('click', reset);
    
    // Стиль для летающих кубов (добавляем динамически)
    const style = document.createElement('style');
    style.textContent = `
        .cube-explode {
            position: fixed;
            width: 40px;
            height: 40px;
            background: #FF8C00;
            border: 2px solid #fff;
            transform: rotate(45deg);
            pointer-events: none;
            z-index: 1000;
            animation: flyCube 1.5s forwards;
        }
        @keyframes flyCube {
            0% { transform: rotate(45deg) scale(0.5); opacity: 1; }
            100% { transform: rotate(360deg) translateY(-300px) translateX(100px) scale(1.5); opacity: 0; }
        }
    `;
    document.head.appendChild(style);
    
    // Инициализация
    updateUI();
    startCooling();
</script>
</body>
</html>
