<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASL | Пятнашки</title>
    <style>
        body {
            background: url('../photo/i.png') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .game-container {
            background: rgba(0,0,0,0.7);
            padding: 20px;
            border-radius: 20px;
            border: 2px solid #FF8C00;
            text-align: center;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 70px);
            gap: 5px;
            background-color: #1a2a2f;
            padding: 15px;
            border-radius: 12px;
        }
        .cell {
            width: 70px;
            height: 70px;
            background-color: #2c3e2f;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
            color: #FF8C00;
            cursor: pointer;
        }
        .cell.empty {
            background-color: #111;
            color: #333;
        }
        button {
            background: #4A90E2;
            border: none;
            padding: 8px 20px;
            margin: 15px 5px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            border-radius: 30px;
            cursor: pointer;
        }
        button:hover { background: #FF8C00; }
        a { color: #FF8C00; text-decoration: none; }

        /* Модальное окно ГЛюКа */
        .gluk-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(10px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .gluk-content {
            background: #1a2a2f;
            border: 3px solid #FF8C00;
            border-radius: 30px;
            max-width: 450px;
            width: 90%;
            padding: 25px;
            text-align: center;
            box-shadow: 0 0 40px rgba(255,140,0,0.3);
        }
        .gluk-avatar {
            background: #00FF9D;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            margin: 0 auto 15px;
            box-shadow: 0 0 15px #0f0;
        }
        .gluk-name {
            color: #FF8C00;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 15px;
            letter-spacing: 2px;
        }
        .gluk-message {
            color: #0f0;
            font-size: 18px;
            line-height: 1.4;
            margin-bottom: 25px;
            font-family: monospace;
        }
        .gluk-close {
            background: #4A90E2;
            border: none;
            border-radius: 40px;
            padding: 10px 25px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            transition: 0.2s;
        }
        .gluk-close:hover {
            background: #FF8C00;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
<div class="game-container">
    <h2 style="color:#FF8C00;">ПЯТНАШКИ</h2>
    <div id="puzzle" class="grid"></div>
    <button id="shuffle">🔀 Перемешать</button>
    <div><a href="../minigames.html">← К списку игр</a></div>
</div>

<!-- Модальное окно ГЛюКа -->
<div id="glukModal" class="gluk-modal">
    <div class="gluk-content">
        <div class="gluk-avatar">🟩</div>
        <div class="gluk-name">ГЛюК (главный логический компьютер)</div>
        <div class="gluk-message" id="glukMessage"></div>
        <button class="gluk-close" id="glukCloseBtn">🔁 НОВАЯ ИГРА</button>
    </div>
</div>

<script>
    const size = 4;
    let tiles = [];
    let emptyRow = 3, emptyCol = 3;
    let gameLocked = false; // блокировка ходов после победы

    // Массив фраз ГЛюКа с подколами
    const victoryMessages = [
        "Ну наконец-то! Я уже думал, ты будешь собирать эти пятнашки до конца времён.",
        "Поздравляю... Но знаешь, даже мой холодильник собирает их быстрее.",
        "Справился. Удивительно. Видимо, у тебя есть свободное время.",
        "О, смотрите, кто-то победил! Наверное, это был просто случайный ход?",
        "Неужели ты смог? А я уже приготовил пресс... Ладно, повезло тебе.",
        "Победа? Да ты просто перебирал варианты, пока не повезло.",
        "Поздравляю. Но в следующий раз я сделаю пятнашки 6x6, посмотрим, как ты запоешь.",
        "Хм. Одна победа из тысячи попыток. Неплохо для болвана.",
        "Ты это серьёзно? Пять минут возился с простейшей головоломкой. Ладно, забирай свою победу.",
        "Собрал. И что? Теперь чувствуешь себя гением? Иди дальше, не задерживайся."
    ];

    function initBoard() {
        tiles = [];
        for (let i = 0; i < size; i++) {
            tiles[i] = [];
            for (let j = 0; j < size; j++) {
                tiles[i][j] = i * size + j + 1;
            }
        }
        tiles[size-1][size-1] = 0;
        emptyRow = size-1;
        emptyCol = size-1;
        gameLocked = false;
        render();
    }

    function render() {
        const container = document.getElementById('puzzle');
        container.innerHTML = '';
        for (let i = 0; i < size; i++) {
            for (let j = 0; j < size; j++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                const val = tiles[i][j];
                if (val === 0) {
                    cell.classList.add('empty');
                    cell.textContent = '';
                } else {
                    cell.textContent = val;
                }
                cell.addEventListener('click', (function(row, col) {
                    return function() { moveTile(row, col); };
                })(i, j));
                container.appendChild(cell);
            }
        }
    }

    function moveTile(row, col) {
        if (gameLocked) return;
        if ((Math.abs(row - emptyRow) + Math.abs(col - emptyCol)) === 1) {
            tiles[emptyRow][emptyCol] = tiles[row][col];
            tiles[row][col] = 0;
            emptyRow = row;
            emptyCol = col;
            render();
            if (checkWin()) {
                gameLocked = true;
                showVictoryModal();
            }
        }
    }

    // Проверка победы (все клетки по порядку, последняя пустая)
    function checkWin() {
        for (let i = 0; i < size; i++) {
            for (let j = 0; j < size; j++) {
                if (i === size-1 && j === size-1) continue;
                if (tiles[i][j] !== i * size + j + 1) return false;
            }
        }
        return true;
    }

    // Перемешивание случайными ходами из пустой клетки (гарантирует разрешимость)
    function shuffleBoard() {
        for (let step = 0; step < 500; step++) {
            let moves = [];
            if (emptyRow > 0) moves.push([emptyRow-1, emptyCol]);
            if (emptyRow < size-1) moves.push([emptyRow+1, emptyCol]);
            if (emptyCol > 0) moves.push([emptyRow, emptyCol-1]);
            if (emptyCol < size-1) moves.push([emptyRow, emptyCol+1]);
            let random = moves[Math.floor(Math.random() * moves.length)];
            // временно отключаем блокировку, чтобы перемешать
            let wasLocked = gameLocked;
            gameLocked = false;
            moveTile(random[0], random[1]);
            gameLocked = wasLocked;
        }
    }

    // Показать модальное окно с случайной фразой
    function showVictoryModal() {
        const modal = document.getElementById('glukModal');
        const msgSpan = document.getElementById('glukMessage');
        const randomIndex = Math.floor(Math.random() * victoryMessages.length);
        msgSpan.innerHTML = victoryMessages[randomIndex];
        modal.style.display = 'flex';
    }

    // Закрыть модалку и начать новую игру
    function closeModalAndRestart() {
        const modal = document.getElementById('glukModal');
        modal.style.display = 'none';
        // Сброс доски и перемешивание
        initBoard();
        shuffleBoard();
    }

    // Обработчики
    document.getElementById('shuffle').addEventListener('click', () => {
        if (gameLocked) {
            // если игра заблокирована победой, сначала сбросим флаг
            gameLocked = false;
        }
        initBoard();
        shuffleBoard();
    });
    document.getElementById('glukCloseBtn').addEventListener('click', closeModalAndRestart);

    // Старт игры
    initBoard();
    shuffleBoard(); // начальная перемешка
</script>
</body>
</html>
