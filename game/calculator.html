<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ASL | Калькулятор</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: url('photo/i.png') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Segoe UI', 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .calculator-container {
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(8px);
            border-radius: 40px;
            padding: 25px;
            border: 2px solid #FF8C00;
            box-shadow: 0 20px 35px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
            width: 100%;
            max-width: 380px;
        }

        .display {
            background: #1e2a2f;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 25px;
            text-align: right;
            border: 1px solid #4A90E2;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.5), 0 1px 0 rgba(255,255,255,0.1);
        }
        .display .expression {
            color: #aaa;
            font-size: 18px;
            min-height: 28px;
            word-wrap: break-word;
            word-break: break-all;
        }
        .display .result {
            color: #FF8C00;
            font-size: 42px;
            font-weight: bold;
            margin-top: 8px;
            word-wrap: break-word;
            word-break: break-all;
            line-height: 1.2;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .btn {
            background: #2c3e2f;
            border: none;
            border-radius: 30px;
            padding: 18px 0;
            font-size: 24px;
            font-weight: bold;
            color: #FF8C00;
            cursor: pointer;
            transition: all 0.1s ease;
            box-shadow: 0 5px 0 #1a2a1f;
            font-family: monospace;
            text-align: center;
        }
        .btn:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #1a2a1f;
        }
        .btn-ac {
            background: #8b3a3a;
            color: #fff;
            box-shadow: 0 5px 0 #5a1a1a;
        }
        .btn-equals {
            background: #FF8C00;
            color: #000;
            box-shadow: 0 5px 0 #b85c00;
        }
        .btn-operator {
            background: #4A90E2;
            color: #fff;
            box-shadow: 0 5px 0 #2c5a8c;
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #FF8C00;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            border: 1px solid #FF8C00;
            border-radius: 40px;
            padding: 8px;
            transition: 0.2s;
        }
        .back-link:hover {
            background: #FF8C00;
            color: #000;
        }
        @media (max-width: 480px) {
            .btn { padding: 14px 0; font-size: 20px; }
            .display .result { font-size: 32px; }
            .calculator-container { padding: 20px; }
        }
    </style>
</head>
<body>
<div class="calculator-container">
    <div class="display">
        <div class="expression" id="expression"></div>
        <div class="result" id="result">0</div>
    </div>
    <div class="buttons">
        <button class="btn btn-ac" data-action="clear">AC</button>
        <button class="btn btn-operator" data-op="sign">±</button>
        <button class="btn btn-operator" data-op="percent">%</button>
        <button class="btn btn-operator" data-op="/">÷</button>

        <button class="btn btn-number" data-num="7">7</button>
        <button class="btn btn-number" data-num="8">8</button>
        <button class="btn btn-number" data-num="9">9</button>
        <button class="btn btn-operator" data-op="*">×</button>

        <button class="btn btn-number" data-num="4">4</button>
        <button class="btn btn-number" data-num="5">5</button>
        <button class="btn btn-number" data-num="6">6</button>
        <button class="btn btn-operator" data-op="-">−</button>

        <button class="btn btn-number" data-num="1">1</button>
        <button class="btn btn-number" data-num="2">2</button>
        <button class="btn btn-number" data-num="3">3</button>
        <button class="btn btn-operator" data-op="+">+</button>

        <button class="btn btn-number" data-num="0">0</button>
        <button class="btn btn-number" data-num=".">.</button>
        <button class="btn btn-operator" data-action="backspace">⌫</button>
        <button class="btn btn-equals" data-action="equals">=</button>
    </div>
    <a href="minigames.html" class="back-link">← ВЕРНУТЬСЯ К ИГРАМ</a>
</div>

<script>
    // Состояние калькулятора (простая логика без eval)
    let currentInput = "0";      // текущее вводимое число
    let previousInput = null;     // предыдущее число
    let currentOperator = null;    // текущий оператор
    let waitingForOperand = false; // ожидание ввода операнда после оператора
    let expressionDisplay = "";    // для отображения выражения

    const resultDiv = document.getElementById('result');
    const expressionDiv = document.getElementById('expression');

    function updateDisplay() {
        resultDiv.innerText = currentInput;
        expressionDiv.innerText = expressionDisplay;
    }

    // Выполнение вычисления
    function calculate() {
        if (previousInput === null || currentOperator === null) return;
        let prev = parseFloat(previousInput);
        let current = parseFloat(currentInput);
        if (isNaN(prev) || isNaN(current)) return;
        let result;
        switch (currentOperator) {
            case '+': result = prev + current; break;
            case '-': result = prev - current; break;
            case '*': result = prev * current; break;
            case '/': 
                if (current === 0) {
                    result = "Ошибка";
                } else {
                    result = prev / current;
                }
                break;
            default: return;
        }
        if (result === "Ошибка") {
            currentInput = "Ошибка";
            previousInput = null;
            currentOperator = null;
            waitingForOperand = false;
            expressionDisplay = "";
        } else {
            // Округление до 10 знаков
            currentInput = parseFloat(result.toFixed(10)).toString();
            previousInput = null;
            currentOperator = null;
            waitingForOperand = true; // после равно ожидаем новый операнд
            expressionDisplay = "";
        }
        updateDisplay();
    }

    // Обработка цифр и точки
    function inputNumber(num) {
        if (currentInput === "Ошибка") {
            resetCalculator();
        }
        if (waitingForOperand) {
            currentInput = num;
            waitingForOperand = false;
            expressionDisplay = "";
        } else {
            if (num === '.' && currentInput.includes('.')) return;
            if (currentInput === "0" && num !== '.') {
                currentInput = num;
            } else {
                currentInput += num;
            }
        }
        updateDisplay();
    }

    // Обработка операторов
    function inputOperator(op) {
        if (currentInput === "Ошибка") {
            resetCalculator();
            return;
        }
        // Если уже есть ожидание операнда, просто меняем оператор
        if (waitingForOperand) {
            currentOperator = op;
            // обновляем отображение выражения
            if (expressionDisplay.length > 0 && /[+\-*/]$/.test(expressionDisplay.slice(-1))) {
                expressionDisplay = expressionDisplay.slice(0, -1) + getOperatorSymbol(op);
            } else {
                expressionDisplay = previousInput + " " + getOperatorSymbol(op);
            }
            updateDisplay();
            return;
        }
        // Если есть предыдущий оператор, сначала вычисляем
        if (previousInput !== null && currentOperator !== null) {
            let prev = parseFloat(previousInput);
            let current = parseFloat(currentInput);
            let result;
            switch (currentOperator) {
                case '+': result = prev + current; break;
                case '-': result = prev - current; break;
                case '*': result = prev * current; break;
                case '/': 
                    if (current === 0) result = "Ошибка";
                    else result = prev / current;
                    break;
                default: result = current;
            }
            if (result === "Ошибка") {
                currentInput = "Ошибка";
                previousInput = null;
                currentOperator = null;
                waitingForOperand = false;
                expressionDisplay = "";
                updateDisplay();
                return;
            }
            currentInput = parseFloat(result.toFixed(10)).toString();
        }
        previousInput = currentInput;
        currentOperator = op;
        waitingForOperand = true;
        expressionDisplay = previousInput + " " + getOperatorSymbol(op);
        updateDisplay();
    }

    function getOperatorSymbol(op) {
        switch(op) {
            case '+': return '+';
            case '-': return '−';
            case '*': return '×';
            case '/': return '÷';
            default: return op;
        }
    }

    function handleEquals() {
        if (currentInput === "Ошибка") {
            resetCalculator();
            return;
        }
        if (previousInput !== null && currentOperator !== null && !waitingForOperand) {
            calculate();
        } else {
            // если нет операции, просто отображаем текущее число
            expressionDisplay = "";
            waitingForOperand = false;
            updateDisplay();
        }
    }

    function handlePercent() {
        if (currentInput === "Ошибка") return;
        let val = parseFloat(currentInput);
        if (isNaN(val)) return;
        let percentVal = val / 100;
        currentInput = percentVal.toString();
        if (!waitingForOperand) {
            // если не ждём операнд, то обновляем выражение
            if (expressionDisplay !== "") {
                expressionDisplay = currentInput;
            }
        }
        updateDisplay();
    }

    function handleSign() {
        if (currentInput === "Ошибка") return;
        let val = parseFloat(currentInput);
        if (isNaN(val)) return;
        currentInput = (-val).toString();
        updateDisplay();
    }

    function handleBackspace() {
        if (currentInput === "Ошибка") {
            resetCalculator();
            return;
        }
        if (waitingForOperand) {
            // если ждём операнд, то сброс оператора
            previousInput = null;
            currentOperator = null;
            waitingForOperand = false;
            expressionDisplay = "";
            updateDisplay();
            return;
        }
        if (currentInput.length > 1) {
            currentInput = currentInput.slice(0, -1);
        } else {
            currentInput = "0";
        }
        updateDisplay();
    }

    function resetCalculator() {
        currentInput = "0";
        previousInput = null;
        currentOperator = null;
        waitingForOperand = false;
        expressionDisplay = "";
        updateDisplay();
    }

    // Привязка кнопок
    document.querySelectorAll('.btn-number').forEach(btn => {
        btn.addEventListener('click', () => {
            const num = btn.getAttribute('data-num');
            if (num) inputNumber(num);
        });
    });
    document.querySelectorAll('.btn-operator').forEach(btn => {
        btn.addEventListener('click', () => {
            const op = btn.getAttribute('data-op');
            if (op === 'sign') handleSign();
            else if (op === 'percent') handlePercent();
            else if (op === 'backspace') handleBackspace();
            else if (op === 'clear') resetCalculator();
            else if (op) inputOperator(op);
        });
    });
    document.querySelector('.btn-ac').addEventListener('click', resetCalculator);
    document.querySelector('.btn-equals').addEventListener('click', handleEquals);

    // Поддержка клавиатуры
    document.addEventListener('keydown', (e) => {
        const key = e.key;
        if (/[0-9]/.test(key)) inputNumber(key);
        else if (key === '.') inputNumber('.');
        else if (key === '+' || key === '-' || key === '*' || key === '/') {
            let opMap = {'*':'*', '/':'/', '-':'-', '+':'+'};
            let op = opMap[key];
            if (op) inputOperator(op);
        }
        else if (key === 'Enter') handleEquals();
        else if (key === 'Backspace') handleBackspace();
        else if (key === 'Escape') resetCalculator();
        else if (key === '%') handlePercent();
    });
</script>
</body>
</html>
