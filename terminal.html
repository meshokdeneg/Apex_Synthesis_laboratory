<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASL | Терминал доступа</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0f1a;
            font-family: 'Courier New', monospace;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .terminal-container {
            max-width: 600px;
            width: 100%;
            background: #0f1a1f;
            border: 2px solid #00FF9D;
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(0, 255, 157, 0.2);
            overflow: hidden;
        }

        .terminal-header {
            background: #1a2a2f;
            padding: 12px 20px;
            border-bottom: 1px solid #00FF9D;
            display: flex;
            gap: 12px;
        }

        .terminal-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #e74c3c;
        }
        .terminal-dot:nth-child(2) { background: #f1c40f; }
        .terminal-dot:nth-child(3) { background: #2ecc71; }

        .terminal-title {
            color: #aaa;
            font-size: 12px;
            margin-left: auto;
        }

        .terminal-body {
            padding: 30px;
        }

        .terminal-line {
            color: #00FF9D;
            font-size: 16px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .prompt {
            color: #FF8C00;
        }

        .terminal-input {
            background: transparent;
            border: none;
            color: #00FF9D;
            font-family: 'Courier New', monospace;
            font-size: 16px;
            flex: 1;
            outline: none;
            min-width: 200px;
        }

        .terminal-input::placeholder {
            color: #3a6a5a;
        }

        .error-line {
            color: #e74c3c;
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }

        .ascii-art {
            color: #FF8C00;
            font-size: 10px;
            white-space: pre;
            text-align: center;
            margin-bottom: 20px;
            opacity: 0.7;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #4A90E2;
            text-decoration: none;
            font-size: 12px;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .cursor {
            display: inline-block;
            width: 8px;
            height: 16px;
            background: #00FF9D;
            animation: blink 1s infinite;
            margin-left: 2px;
        }
    </style>
</head>
<body>
    <div class="terminal-container">
        <div class="terminal-header">
            <div class="terminal-dot"></div>
            <div class="terminal-dot"></div>
            <div class="terminal-dot"></div>
            <div class="terminal-title">ASL_TERMINAL v2.3</div>
        </div>
        <div class="terminal-body">
            <div class="ascii-art">
   ___   ___   _        ___   _      _        _   
  / __| / __| | |      / __| | |    | |      | |  
 | (__ | (__  | |__    \__ \ | |__  | |__    | |_ 
  \___| \___| |____|   |___/ |____| |____|    \__|
            </div>
            <div class="terminal-line">
                <span class="prompt">➜</span>
                <span>Доступ к админ-панели</span>
            </div>
            <div class="terminal-line">
                <span class="prompt">➜</span>
                <span>Введите код доступа:</span>
            </div>
            <div class="terminal-line">
                <span class="prompt">$</span>
                <input type="password" id="accessCode" class="terminal-input" placeholder="********" autocomplete="off">
                <span class="cursor"></span>
            </div>
            <div id="errorMsg" class="error-line">⚠️ Неверный код доступа</div>
            <div style="margin-top: 30px; text-align: center;">
                <button id="submitBtn" style="background: #2c3e2f; border: 1px solid #FF8C00; color: #FF8C00; padding: 8px 24px; font-family: monospace; cursor: pointer;">ПОДТВЕРДИТЬ</button>
            </div>
            <div style="text-align: center; margin-top: 20px;">
                <a href="index.html" class="back-link">← Вернуться на главную</a>
            </div>
        </div>
    </div>

    <script>
        // ========== КОД ДОСТУПА (можно изменить) ==========
        const ADMIN_CODE = "PRINCIPLE_OF_TEAPOT";
        
        document.getElementById('submitBtn').addEventListener('click', function() {
            const code = document.getElementById('accessCode').value;
            const errorMsg = document.getElementById('errorMsg');
            
            if (code === ADMIN_CODE) {
                // Перенаправляем на админ-страницу
                window.location.href = 'admin_menu.html';
            } else {
                errorMsg.style.display = 'block';
                document.getElementById('accessCode').value = '';
                setTimeout(() => {
                    errorMsg.style.display = 'none';
                }, 3000);
            }
        });
        
        // Enter для отправки
        document.getElementById('accessCode').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('submitBtn').click();
            }
        });
    </script>
</body>
</html>
