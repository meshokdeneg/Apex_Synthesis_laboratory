<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASL | Админ-панель</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0a0f1a 0%, #0c111c 100%);
            font-family: 'Segoe UI', 'Courier New', monospace;
            min-height: 100vh;
            padding: 30px;
        }

        .admin-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .admin-header {
            background: #1a2a2f;
            padding: 20px 30px;
            border-bottom: 3px solid #FF8C00;
            border-radius: 16px 16px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .admin-header h1 {
            color: #FF8C00;
            font-size: 28px;
        }

        .admin-header span {
            color: #00FF9D;
            font-size: 14px;
        }

        .admin-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }

        .stat-card {
            background: rgba(30,35,45,0.9);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid rgba(255,140,0,0.3);
            text-align: center;
        }

        .stat-number {
            font-size: 48px;
            font-weight: bold;
            color: #FF8C00;
        }

        .stat-label {
            color: #aaa;
            font-size: 14px;
            margin-top: 5px;
        }

        .admin-section {
            background: rgba(30,35,45,0.9);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 30px;
            border: 1px solid rgba(255,140,0,0.3);
        }

        .admin-section h2 {
            color: #FF8C00;
            font-size: 22px;
            margin-bottom: 20px;
            border-bottom: 1px solid #2c3e2f;
            padding-bottom: 10px;
        }

        .user-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 300px;
            overflow-y: auto;
        }

        .user-item {
            background: #1a2a2f;
            padding: 12px 15px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .user-info {
            color: #00FF9D;
            font-family: monospace;
        }

        .user-actions button {
            background: #e74c3c;
            border: none;
            padding: 5px 12px;
            border-radius: 6px;
            color: white;
            cursor: pointer;
            margin-left: 8px;
        }

        .user-actions button.edit {
            background: #4A90E2;
        }

        .log-area {
            background: #0a0f1a;
            padding: 15px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 12px;
            color: #00FF9D;
            max-height: 200px;
            overflow-y: auto;
        }

        .log-line {
            padding: 4px 0;
            border-bottom: 1px solid #1a2a2f;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #4A90E2;
            text-decoration: none;
        }

        .back-link:hover {
            color: #FF8C00;
        }

        @media (max-width: 700px) {
            body { padding: 15px; }
            .admin-header h1 { font-size: 20px; }
            .stat-number { font-size: 32px; }
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <div class="admin-header">
            <h1>🔐 АДМИН-ПАНЕЛЬ ASL</h1>
            <span>⚡ Сингулярный доступ</span>
        </div>

        <div class="admin-stats">
            <div class="stat-card">
                <div class="stat-number" id="usersCount">0</div>
                <div class="stat-label">ПОЛЬЗОВАТЕЛЕЙ</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="totalCubes">0</div>
                <div class="stat-label">ВСЕГО КУБОВ</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="activeToday">0</div>
                <div class="stat-label">АКТИВНЫХ СЕГОДНЯ</div>
            </div>
        </div>

        <div class="admin-section">
            <h2>👥 УПРАВЛЕНИЕ ПОЛЬЗОВАТЕЛЯМИ</h2>
            <div id="usersList" class="user-list"></div>
        </div>

        <div class="admin-section">
            <h2>📋 ЛОГ ДЕЙСТВИЙ</h2>
            <div id="logArea" class="log-area"></div>
        </div>

        <div class="admin-section">
            <h2>⚙️ БЫСТРЫЕ ДЕЙСТВИЯ</h2>
            <div style="display: flex; gap: 15px; flex-wrap: wrap;">
                <button id="broadcastBtn" style="background: #4A90E2; border: none; padding: 10px 20px; border-radius: 8px; color: white; cursor: pointer;">📢 Сделать объявление</button>
                <button id="resetStatsBtn" style="background: #e74c3c; border: none; padding: 10px 20px; border-radius: 8px; color: white; cursor: pointer;">⚠️ Сбросить статистику</button>
                <button id="refreshBtn" style="background: #2c3e2f; border: 1px solid #FF8C00; padding: 10px 20px; border-radius: 8px; color: #FF8C00; cursor: pointer;">🔄 Обновить</button>
            </div>
        </div>

        <a href="index.html" class="back-link">← Вернуться на главную</a>
    </div>

    <script>
        // ========== ЗАГРУЗКА ДАННЫХ ИЗ LOCALSTORAGE ==========
        function loadAdminData() {
            // Получаем всех пользователей из localStorage
            const allUsers = JSON.parse(localStorage.getItem('asl_all_users')) || [];
            const usersData = [];
            let totalCubesSum = 0;
            
            for (let username of allUsers) {
                const userKey = `asl_user_${username}`;
                let userData = JSON.parse(localStorage.getItem(userKey));
                if (!userData && username === 'Meshokdeneg') {
                    userData = JSON.parse(localStorage.getItem('asl_user'));
                }
                if (userData) {
                    usersData.push(userData);
                    totalCubesSum += userData.cubes || 0;
                } else {
                    usersData.push({ username: username, cubes: 0, email: 'нет данных' });
                }
            }
            
            // Если нет сохранённых пользователей, добавляем текущего
            if (usersData.length === 0) {
                const currentUser = JSON.parse(localStorage.getItem('asl_user'));
                if (currentUser) {
                    usersData.push(currentUser);
                    totalCubesSum += currentUser.cubes || 0;
                }
            }
            
            document.getElementById('usersCount').textContent = usersData.length;
            document.getElementById('totalCubes').textContent = totalCubesSum;
            document.getElementById('activeToday').textContent = usersData.length;
            
            // Рендерим список пользователей
            const usersList = document.getElementById('usersList');
            if (usersData.length === 0) {
                usersList.innerHTML = '<div style="color:#aaa; text-align:center;">Нет пользователей</div>';
            } else {
                usersList.innerHTML = usersData.map(user => `
                    <div class="user-item">
                        <div class="user-info">
                            🧊 ${user.username || user.name || 'Без имени'} 
                            ${user.email ? `(${user.email})` : ''}
                            | 🧊 кубов: ${user.cubes || 0}
                        </div>
                        <div class="user-actions">
                            <button class="edit" onclick="editUser('${user.username || user.name}')">✎ Редактировать</button>
                            <button onclick="deleteUser('${user.username || user.name}')">🗑 Удалить</button>
                        </div>
                    </div>
                `).join('');
            }
            
            // Загружаем логи
            const logs = JSON.parse(localStorage.getItem('asl_admin_logs')) || [
                { time: new Date().toLocaleString(), action: 'Админ-панель открыта' }
            ];
            const logArea = document.getElementById('logArea');
            logArea.innerHTML = logs.slice(-20).map(log => 
                `<div class="log-line">[${log.time}] ${log.action}</div>`
            ).join('');
        }
        
        function addLog(action) {
            const logs = JSON.parse(localStorage.getItem('asl_admin_logs')) || [];
            logs.push({ time: new Date().toLocaleString(), action: action });
            if (logs.length > 50) logs.shift();
            localStorage.setItem('asl_admin_logs', JSON.stringify(logs));
            loadAdminData();
        }
        
        function editUser(username) {
            const newCubes = prompt(`Введите количество кубов для ${username}:`);
            if (newCubes !== null && !isNaN(parseInt(newCubes))) {
                // Ищем пользователя
                const userKey = `asl_user_${username}`;
                let userData = JSON.parse(localStorage.getItem(userKey));
                if (!userData && username === 'Meshokdeneg') {
                    userData = JSON.parse(localStorage.getItem('asl_user'));
                }
                if (userData) {
                    userData.cubes = parseInt(newCubes);
                    localStorage.setItem(userKey, JSON.stringify(userData));
                    if (username === 'Meshokdeneg') {
                        localStorage.setItem('asl_user', JSON.stringify(userData));
                    }
                    addLog(`Изменены кубы пользователя ${username} на ${newCubes}`);
                    loadAdminData();
                } else {
                    alert('Пользователь не найден');
                }
            }
        }
        
        function deleteUser(username) {
            if (confirm(`Удалить пользователя ${username}? Это действие необратимо.`)) {
                // Удаляем из списка пользователей
                let allUsers = JSON.parse(localStorage.getItem('asl_all_users')) || [];
                allUsers = allUsers.filter(u => u !== username);
                localStorage.setItem('asl_all_users', JSON.stringify(allUsers));
                
                // Удаляем данные пользователя
                localStorage.removeItem(`asl_user_${username}`);
                
                addLog(`Пользователь ${username} удалён`);
                loadAdminData();
            }
        }
        
        // Объявление для всех
        function broadcast() {
            const message = prompt('Введите сообщение для всех пользователей:');
            if (message) {
                localStorage.setItem('asl_broadcast', JSON.stringify({
                    message: message,
                    time: new Date().toLocaleString(),
                    author: 'Админ'
                }));
                addLog(`Сделано объявление: "${message}"`);
                alert('Объявление отправлено!');
            }
        }
        
        // Сброс статистики
        function resetStats() {
            if (confirm('Сбросить всю статистику? Это действие необратимо.')) {
                localStorage.removeItem('asl_all_users');
                localStorage.removeItem('asl_friends');
                localStorage.removeItem('asl_messages');
                localStorage.removeItem('asl_badges');
                localStorage.removeItem('asl_achievements');
                addLog('Сброшена вся статистика сайта');
                alert('Статистика сброшена');
                loadAdminData();
            }
        }
        
        document.getElementById('broadcastBtn').addEventListener('click', broadcast);
        document.getElementById('resetStatsBtn').addEventListener('click', resetStats);
        document.getElementById('refreshBtn').addEventListener('click', () => loadAdminData());
        
        loadAdminData();
    </script>
</body>
</html>
