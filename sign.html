<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>ASL | Бейдж ASL</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: url('https://static.planetminecraft.com/files/image/minecraft/texture-pack/2021/362/14416263-quartzpack_l.jpg') repeat;
            background-size: 64px 64px;
            font-family: 'Segoe UI', 'Courier New', monospace;
            color: #1a1a1a;
            line-height: 1.5;
            padding: 40px 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .badge-container {
            max-width: 550px;
            width: 100%;
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(1px);
            border: 3px solid #2c3e2f;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.25), 0 0 0 1px rgba(255,255,255,0.3);
            border-radius: 12px;
            overflow: hidden;
        }

        .badge-header {
            background: #1a2a2f;
            padding: 22px 30px;
            border-bottom: 4px solid #FF8C00;
            text-align: center;
        }

        .badge-header h1 {
            font-size: 32px;
            color: #FF8C00;
            letter-spacing: 2px;
            font-weight: 700;
        }

        .badge-header p {
            font-size: 14px;
            color: #ccc;
            margin-top: 8px;
        }

        .badge-body {
            padding: 32px 30px 35px;
        }

        .badge-sub {
            font-size: 14px;
            color: #555;
            margin-bottom: 25px;
            border-bottom: 1px solid #e0e0e0;
            padding-bottom: 12px;
            text-align: center;
        }

        .input-group {
            text-align: left;
            margin-bottom: 22px;
        }

        .input-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #1a2a2f;
            margin-bottom: 8px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            font-size: 15px;
            font-family: 'Segoe UI', monospace;
            background: #fff;
            border: 1.5px solid #b0b0b0;
            border-radius: 8px;
            transition: 0.2s;
            color: #1a1a1a;
        }

        .input-group input:focus {
            outline: none;
            border-color: #FF8C00;
            box-shadow: 0 0 0 3px rgba(255, 140, 0, 0.2);
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            background: #2c3e2f;
            border: 2px solid #FF8C00;
            border-radius: 40px;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            color: #FF8C00;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 10px;
            font-family: inherit;
        }

        .login-btn:hover {
            background: #FF8C00;
            color: #1a2a2f;
            border-color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 140, 0, 0.3);
        }

        .back-link {
            display: inline-block;
            margin-top: 25px;
            font-size: 14px;
            color: #4A90E2;
            text-decoration: none;
            border-bottom: 1px dashed #4A90E2;
        }

        .back-link:hover {
            color: #FF8C00;
            border-bottom-color: #FF8C00;
        }

        .asl-footer {
            margin-top: 30px;
            padding-top: 18px;
            border-top: 1px solid #e0e0e0;
            text-align: center;
            font-size: 11px;
            color: #888;
            font-family: monospace;
        }

        .error-message {
            background: #fff2f0;
            border-left: 3px solid #d32f2f;
            padding: 10px 12px;
            font-size: 13px;
            color: #b33;
            margin-bottom: 20px;
            text-align: left;
            font-family: monospace;
            display: none;
            border-radius: 6px;
        }

        .loading-message {
            text-align: center;
            margin-top: 15px;
            color: #FF8C00;
            font-size: 13px;
            display: none;
        }

        @media (max-width: 600px) {
            .badge-header h1 {
                font-size: 26px;
            }
            .badge-header {
                padding: 16px 20px;
            }
            .badge-body {
                padding: 24px 20px 28px;
            }
            .input-group input {
                padding: 10px 12px;
                font-size: 14px;
            }
            .login-btn {
                padding: 10px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="badge-container">
        <div class="badge-header">
            <h1>🏷️ БЕЙДЖ ASL</h1>
            <p>Авторизация в системе</p>
        </div>

        <div class="badge-body">
            <div class="badge-sub">Доступ к защищённым протоколам</div>

            <div class="error-message" id="errorMsg"></div>
            <div class="loading-message" id="loadingMsg">⏳ Поиск аккаунта...</div>

            <form id="loginForm">
                <div class="input-group">
                    <label>Идентификатор сотрудника (ник)</label>
                    <input type="text" id="username" placeholder="Ваш никнейм" autocomplete="off">
                </div>
                <div class="input-group">
                    <label>Код доступа</label>
                    <input type="password" id="password" placeholder="Пароль">
                </div>
                <button type="submit" class="login-btn">ВОЙТИ →</button>
            </form>

            <div style="text-align: center;">
                <a href="index.html" class="back-link">← вернуться на главную страницу</a>
            </div>

            <div class="asl-footer">
                ASL • отдел TToS • версия протокола 2.3
            </div>
        </div>
    </div>

    <script>
        // ========== FIREBASE КОНФИГ ==========
        const firebaseConfig = {
            apiKey: "AIzaSyAuCRlflkjJQeKd4EyBGQIa6wUNWLNKo3c",
            authDomain: "apex-8f11e.firebaseapp.com",
            projectId: "apex-8f11e",
            storageBucket: "apex-8f11e.firebasestorage.app",
            messagingSenderId: "923734077108",
            appId: "1:923734077108:web:f6d2d4059972c215c371e1",
            measurementId: "G-WTKS5JQ7Z5"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();
        const db = firebase.firestore();

        const form = document.getElementById('loginForm');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const errorMsg = document.getElementById('errorMsg');
        const loadingMsg = document.getElementById('loadingMsg');

        function showError(text) {
            errorMsg.style.display = 'block';
            errorMsg.innerHTML = `⚠️ ${text}`;
            setTimeout(() => {
                errorMsg.style.display = 'none';
            }, 4000);
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = usernameInput.value.trim();
            const password = passwordInput.value;
            
            if (!username || !password) {
                showError('Заполните оба поля');
                return;
            }
            
            errorMsg.style.display = 'none';
            loadingMsg.style.display = 'block';
            
            try {
                // 1. Ищем пользователя в Firestore по нику
                const usersRef = db.collection('users');
                const querySnapshot = await usersRef.where('username', '==', username).get();
                
                if (querySnapshot.empty) {
                    throw new Error('Пользователь с таким ником не найден');
                }
                
                let userData = null;
                let userId = null;
                querySnapshot.forEach(doc => {
                    userData = doc.data();
                    userId = doc.id;
                });
                
                if (!userData || !userData.email) {
                    throw new Error('У пользователя не найден email для входа');
                }
                
                const email = userData.email;
                
                // 2. Вход в Firebase Auth по email
                const userCredential = await auth.signInWithEmailAndPassword(email, password);
                const user = userCredential.user;
                
                // 3. Сохраняем в localStorage
                localStorage.setItem('asl_user', JSON.stringify({
                    uid: user.uid,
                    username: userData.username,
                    email: email,
                    bio: userData.bio || 'Новый сотрудник ASL',
                    avatar: userData.avatar || '🧊',
                    level: userData.level || 1,
                    cubes: userData.cubes || 100
                }));
                
                // 4. Перенаправляем на главную
                window.location.href = 'index.html';
                
            } catch (error) {
                console.error('Ошибка входа:', error);
                loadingMsg.style.display = 'none';
                
                if (error.message === 'Пользователь с таким ником не найден') {
                    showError('❌ Пользователь с таким ником не найден');
                } else if (error.code === 'auth/wrong-password') {
                    showError('❌ Неверный пароль');
                } else if (error.code === 'auth/user-not-found') {
                    showError('❌ Пользователь не найден');
                } else {
                    showError('❌ Ошибка входа: ' + (error.message || 'Неизвестная ошибка'));
                }
            }
        });
    </script>
</body>
</html>
